[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtb-telemetry"
version = "0.1.0"
description = "DIY MTB telemetry logger for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "spidev",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
